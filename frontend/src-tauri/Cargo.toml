[package]
name = "flint-prepress"
version = "1.0.0"
description = "Flint Prepress Studio - Local Native Prepress Automation"
authors = ["ESSR_PA"]
edition = "2021"

[lib]
name = "flint_prepress_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
